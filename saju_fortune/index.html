<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주풀이 - 생년월일로 보는 사주</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1>🔮 사주풀이</h1>
      <p class="subtitle">생년월일(과 태어난 시간)을 입력하면 사주팔자를 뽑아드립니다</p>
    </header>

    <main>
      <section class="card form-card">
        <form id="sajuForm">
          <div class="field">
            <label for="birthDate">생년월일</label>
            <input type="date" id="birthDate" name="birthDate" min="1900-01-01" max="2026-12-31" required>
          </div>

          <div class="field">
            <label for="birthTime">태어난 시간</label>
            <div class="time-row">
              <input type="time" id="birthTime" name="birthTime" value="12:00">
              <label class="checkbox-label">
                <input type="checkbox" id="timeUnknown">
                시간을 모릅니다
              </label>
            </div>
          </div>

          <div class="field">
            <label for="gender">성별 <span class="optional">(선택)</span></label>
            <select id="gender" name="gender">
              <option value="">선택 안 함</option>
              <option value="male">남자</option>
              <option value="female">여자</option>
            </select>
          </div>

          <div class="field">
            <label for="name">이름 <span class="optional">(선택)</span></label>
            <input type="text" id="name" name="name" placeholder="예: 홍길동" maxlength="20">
          </div>

          <button type="submit" class="submit-btn">사주 보기</button>
          <p class="calc-note">※ 입춘·절기를 반영한 계산이며, 시간 미상 시 시주는 표시하지 않습니다. 재미로 참고해주세요.</p>
        </form>
      </section>

      <section id="result" class="result hidden"></section>
    </main>

    <footer>
      <p>본 결과는 전통 명리학의 기본 원리(60갑자·오행)를 바탕으로 한 간이 풀이이며, 정확한 감정을 대신하지 않습니다.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
